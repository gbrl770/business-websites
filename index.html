<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>האתרים שלי</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }
    .container {
      width: min(900px, 90%);
      text-align: center;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    p {
      color: #aaa;
      margin-bottom: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    a {
      display: block;
      padding: 30px 20px;
      background: #fff;
      color: #111;
      text-decoration: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      transition: transform .2s;
    }
    a:hover {
      transform: translateY(-4px);
    }
    span {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      font-weight: normal;
      color: #666;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>האתרים שלי</h1>
    <p>פרויקטים ותשתית לפיתוח אתרים לעסקים</p>

    <div class="grid">
      <a href="cameras/">
        אתר המצלמות
        <span>גבריאל — פתרונות אבטחה</span>
      </a>

      <a href="ysoda/">
        אתר יסודא
        <span>בנייה, יזמות, התפתחות</span>
      </a>

      <a href="engine/">
        תשתית אתרים
        <span>Engine לפרויקטים עתידיים</span>
      </a>
    </div>
  </main>

</body>
</html>
